<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscolarApp Print - Iniciar sesión</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('webcups-theme'); } catch (e) {}
            var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute('data-theme', saved || (light ? 'light' : 'dark'));
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-glow"></div>
    <main class="login-page">
        <form class="login-card glass-card" method="post" action="/login">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="">
                <div>
                    <h1>EscolarApp <em>Print</em></h1>
                    <p class="subtitle">Impresiones Lab2</p>
                </div>
            </div>
            {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
            {% if not disabled %}
            <label>
                Contraseña
                <input type="password" name="password" autocomplete="current-password" required autofocus>
            </label>
            <button type="submit" class="btn btn-primary">Entrar</button>
            {% endif %}
        </form>
        <footer class="app-footer">Desarrollado por <a href="https://escolarapp.cl" target="_blank" rel="noopener noreferrer">EscolarApp</a></footer>
    </main>
</body>
</html>
